services:

  postgres:
    image: postgres:16
    container_name: aegisx-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegisx

    ports:
      - "5432:5432"

    volumes:
      - aegisx_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegisx"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: aegisx-backend:latest
    container_name: aegisx-backend

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegisx

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aegisx_postgres_data: